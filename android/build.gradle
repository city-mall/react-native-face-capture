// react-native-face-capture — Android library module.
//
// Old-bridge ReactContextBaseJavaModule (no codegen, no TurboModule spec);
// the New Architecture interop layer loads it unchanged. The host app's
// autolinking picks up FaceCapturePackage from src/main/java.

buildscript {
    ext.getExtOrDefault = { name, defaultValue ->
        rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${getExtOrDefault('AGP', '8.7.2')}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.1.20')}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'live.citymall.facecapture'
    compileSdk getExtOrDefault('compileSdkVersion', 36)

    defaultConfig {
        // CameraX 1.4 and ML Kit face detection both run from API 21; 24 is
        // the lowest any consuming app ships.
        minSdk getExtOrDefault('minSdkVersion', 24)
        targetSdk getExtOrDefault('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // FaceCaptureActivity inflates res/layout/activity_face_capture.xml
        // through ActivityFaceCaptureBinding.
        viewBinding true
        buildConfig false
    }

    lint {
        // minSdk 24 is real: consuming apps still have active users on
        // Android 7.1.1 (2017 hardware). NewApi is the only guard against a
        // call needing a newer API sneaking in — the app this screen came
        // from ships minSdk 26 and would never have caught it.
        abortOnError true
        fatal 'NewApi'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // ReactPackage / bridge APIs. OkHttp arrives transitively with RN, but
    // the uploader is written against it directly, so name it.
    implementation "com.facebook.react:react-android"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Screen: AppCompatActivity, insets, back handling.
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-ktx:1.9.3"
    // Root of res/layout/activity_face_capture.xml.
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Camera. Both activities stick to the 1.4 stable API surface. The host
    // sets `ext.cameraxVersion` in android/build.gradle so this library and
    // react-native-ops-scanner resolve to one tested CameraX; Gradle would
    // otherwise silently pick the highest version any module asks for.
    def cameraxVersion = getExtOrDefault('cameraxVersion', '1.4.2')
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // ML Kit face detection, BUNDLED (~6.9 MB) on purpose: the live checks
    // gate the shutter, so they must run offline, on a fresh install and on
    // stale Play Services rather than "skip" until a Play-delivered model
    // arrives.
    implementation "com.google.mlkit:face-detection:16.1.7"

    // Plain-JVM unit tests for the pure quality maths (ImageQualityAnalyzer).
    testImplementation "junit:junit:4.13.2"
}
